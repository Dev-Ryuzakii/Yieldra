<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your sponsorship · Yieldra</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="wrap site-header">
    <a class="wordmark" href="/">Yieldra</a>
    <nav class="site-nav" aria-label="Site"><a href="/#farms">All farms</a></nav>
  </header>

  <main class="wrap">
    <p class="notice" id="mode" hidden></p>
    <section class="track-head" id="head" aria-live="polite">
      <p class="empty">Loading your sponsorship…</p>
    </section>
    <ol class="stages" id="stages"></ol>
    <div class="track-foot" id="foot"></div>
  </main>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <div class="dialog-body">
      <h2 id="confirm-title">Stop this sponsorship?</h2>
      <p class="sub" id="confirm-text"></p>
      <p class="error-text" id="confirm-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="button stop" type="button" id="confirm-yes">Stop sponsorship</button>
        <button class="button quiet" type="button" id="confirm-no">Keep it going</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="/assets/track.js"></script>
</body>
</html>
