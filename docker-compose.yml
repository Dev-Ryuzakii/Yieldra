services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: yieldra
      POSTGRES_PASSWORD: password
      POSTGRES_DB: yieldra_db
    ports:
      # Host 5433 -> container 5432 to avoid clashing with a local postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yieldra -d yieldra_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://yieldra:password@db:5432/yieldra_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery_worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://yieldra:password@db:5432/yieldra_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - db
    command: celery -A app.tasks.celery_app worker --beat --loglevel=info

volumes:
  pgdata:
